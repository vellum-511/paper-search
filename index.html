<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>紙検索システム</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 15px;
      background: #f7f7f7;
      font-size: 16px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 20px;
    }

    input, button {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 8px;
    }
    
    input {
      border: 1px solid #ccc;
    }

    button {
      background: #00826E;
      color: white;
      border: none;
    }

    table {
      width: 100%;
      margin-top: 15px;
      border-collapse: collapse;
      background: white;
      display: block;
      overflow-x: auto;
      white-space: nowrap;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }

    th {
      background: #f0f0f0;
    }

    tr:hover {
      background: #fafafa;
    }

    .official-link {
      text-decoration: underline;
      color: #00bfff;
    }    
  </style>
</head>

<body>

  <h1>紙検索</h1>

  <!-- 🔍 検索フォーム -->
  <input id="keyword" placeholder="紙名で検索">
  <input id="sample" placeholder="見本帳番号で検索">
  <button onclick="search()">検索</button>

  <!-- 📄 検索結果 -->
  <table>
    <thead>
      <tr>
        <th>紙名</th>
        <th>見本帳番号</th>
        <th>厚み</th>
        <th>場所</th>
        <th>サイズ</th>
        <th>公式ページ</th>
      </tr>
    </thead>
    <tbody id="result"></tbody>
  </table>

  <script>
  const BASE_URL = "https://www.heiwapaper.co.jp/products/details/";
   let data = [];

// ===============================
// CSVをGitHubから自動読み込み（★ここに追加！）
// ===============================
fetch("data.csv")
  .then(res => res.text())
  .then(text => {
    const lines = text.split("\n").map(l => l.trim()).filter(l => l);
    const headers = lines[0].split(",");

    data = lines.slice(1).map(line => {
      const values = line.split(",");
      let obj = {};
      headers.forEach((h, i) => {
        obj[h.trim()] = values[i] ? values[i].trim() : "";
      });
      return obj;
    });

    search(); // ← 読み込んだらすぐ表示
  });

//
document.getElementById("keyword").addEventListener("input", search);
document.getElementById("sample").addEventListener("input", search);

//
function normalize(text) {
  if (!text) return "";

  text = text.replace(/[\u30a1-\u30f6]/g, ch =>
    String.fromCharCode(ch.charCodeAt(0) - 0x60)
  );

  return text.toLowerCase();
}

    // ===============================
    // 検索処理
    // ===============================
function search() {
  const kw = document.getElementById("keyword").value;
  const sn = document.getElementById("sample").value;
  const tbody = document.getElementById("result");

  tbody.innerHTML = "";

const nKw = normalize(kw);
const nSn = normalize(sn);

const result = data.filter(row => {
  const name = normalize(row.paper_name || "");
  const reading = normalize(row.reading || "");
  const sample = normalize(row.sample_number || "");

  const keywordMatch =
    nKw === "" ||
    name.includes(nKw) ||
    (reading && reading.includes(nKw) && nKw.length >= 2);
  
  const sampleMatch =
    nSn === "" ||
    (sample && sample.includes(nSn));

  return keywordMatch && sampleMatch;
});
  
  console.log("件数:", result.length);

  result.forEach(row => {
    const tr = document.createElement("tr");

    const officialUrl = BASE_URL + row.code + "0.html";

    tr.innerHTML = `
      <td>${row.paper_name}</td>
      <td>${row.sample_number}</td>
      <td>${row.caliper}</td>
      <td>${row.location}</td>
      <td>${row.size}</td>
      <td>
        <a href="${officialUrl}" target="_blank" class="official-link">
          詳細
        </a>
      </td>
    `;

    tbody.appendChild(tr);
  });
   if (result.length === 0) {
  tbody.innerHTML = "<tr><td colspan='6'>該当する紙が見つかりません</td></tr>";
}   
}
 
  </script>

</body>
</html>
